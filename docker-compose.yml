# Local services for the RAG system. Usually driven by the Makefile:
#
#   make up        Qdrant + Ollama on CPU
#   make up-gpu    the same, with Ollama on an NVIDIA GPU (adds docker-compose.gpu.yml)
#   make install   one-off R container: install a package into the Docker-only library
#   make sync      one-off R container: read the help pages of the mounted R libraries
#
# Ports are published on 127.0.0.1 only. Settings (models, ports) come from .env,
# falling back to the defaults after ":-" below; see .env.example.

services:
  # Vector database: stores the embedded documentation chunks.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Runs the language models: embeddings and answer generation.
  ollama:
    image: ollama/ollama:0.33.3
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # One-off: downloads the models into the running ollama service, then exits.
  # Profile "init" keeps it out of a plain `docker compose up`.
  ollama-init:
    image: ollama/ollama:0.33.3
    profiles: ["init"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - ollama pull ${LLM_MODEL:-qwen3:1.7b} && ollama pull ${EMBEDDING_MODEL:-nomic-embed-text}
    restart: "no"

  # One-off: reads the help pages of the R libraries below and writes
  # data/extracted/<library>/<package>.jsonl (make sync / make install).
  # Profile "tools" keeps it out of `up`.
  r-extract:
    build:
      context: src/extraction
      args:
        HOST_UID: ${HOST_UID:-1000}
    profiles: ["tools"]
    # Run as the host user, so the files it writes in data/ are yours, not root's.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /work
    volumes:
      - ./src/extraction:/work/extraction:ro
      - ./data:/work/data
      # Host R libraries, read-only. Set the paths in .env (see .env.example).
      # create_host_path: false -> a wrong path is an error, instead of Docker silently
      # creating an empty root-owned folder where R would later want to install.
      - type: bind
        source: ${R_SYSTEM_LIBRARY:-/usr/lib/R/library}
        target: /libraries/system
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${R_USER_LIBRARY:-/R_USER_LIBRARY-is-not-set-see-.env.example}
        target: /libraries/user
        read_only: true
        bind:
          create_host_path: false
      # Docker-only library for reproducible experiments (make install PKG=...).
      - r_docker_lib:/libraries/docker
    entrypoint: ["Rscript", "/work/extraction/main.R"]

volumes:
  qdrant_data:
  ollama_data:
  r_docker_lib:
