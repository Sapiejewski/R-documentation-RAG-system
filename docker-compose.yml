# Local services for the RAG system. Usually driven by the Makefile:
#
#   make up        Qdrant + Ollama (CPU) + the rag API
#   make up-gpu    the same, with Ollama on an NVIDIA GPU (adds docker-compose.gpu.yml)
#   make sync-docker   R client in a container: index the Docker library (no R needed on your computer)
#   make install       R client in a container: install a package into the Docker library
#
# `make init` / `make sync` run the R client in your own R instead: docs/setup.md.
#
# Ports are published on 127.0.0.1 only. Settings (models, ports) come from .env,
# falling back to the defaults after ":-" below; see .env.example.

services:
  # Vector database: stores the embedded documentation chunks.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Runs the language models: embeddings and answer generation.
  ollama:
    image: ollama/ollama:0.33.3
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # The Python service: the HTTP API the R client syncs its libraries through (src/rag/api).
  # Endpoints and their schemas: http://localhost:8000/docs
  rag:
    build: .
    ports:
      - "127.0.0.1:${RAG_HOST_PORT:-8000}:8000"
    # Same settings as on the host (models, collection, LOG_LEVEL); .env is optional.
    env_file:
      - path: .env
        required: false
    environment:
      # Inside Docker the other services are reached by name, not through localhost.
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # One-off: downloads the models into the running ollama service, then exits.
  # Profile "init" keeps it out of a plain `docker compose up`.
  ollama-init:
    image: ollama/ollama:0.33.3
    profiles: ["init"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - ollama pull ${LLM_MODEL:-qwen3:1.7b} && ollama pull ${EMBEDDING_MODEL:-nomic-embed-text}
    restart: "no"

  # Docker mode of the R client (make sync-docker, make install), for running without R on
  # your computer: it indexes only its own library, the r_docker_lib volume, filled by
  # `make install PKG=...` from a dated CRAN snapshot -- the same versions on every machine.
  # (Host mode, the default, runs the same R code in your own R: docs/setup.md.)
  # Profile "tools" keeps it out of `up`.
  r-extract:
    build: src/client
    profiles: ["tools"]
    working_dir: /work
    environment:
      RAG_URL: http://rag:8000
      RDOCS_LIBRARIES: /libraries/docker
      # The index remembers who indexed each library; a host never drops the Docker library.
      RDOCS_ORIGIN: docker
    depends_on:
      rag:
        condition: service_healthy
    volumes:
      - ./src/client:/work/src/client:ro
      - r_docker_lib:/libraries/docker
    entrypoint: ["Rscript", "/work/src/client/main.R"]

  # One-off: the R client's tests (make test-r), same image as r-extract. Only the code and
  # the tests are mounted -- no R libraries, no services: the tests read base R packages and
  # talk to a fake API.
  r-test:
    build: src/client
    profiles: ["tools"]
    working_dir: /work
    volumes:
      - ./src/client:/work/src/client:ro
      - ./tests:/work/tests:ro
    entrypoint: ["Rscript", "-e", "for (dir in c('tests/unit/r', 'tests/contract/r')) testthat::test_dir(dir)"]

volumes:
  qdrant_data:
  ollama_data:
  r_docker_lib:
