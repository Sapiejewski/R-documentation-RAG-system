services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:0.33.3
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  ollama-init:
    image: ollama/ollama:0.33.3
    profiles: ["init"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - ollama pull ${LLM_MODEL:-qwen3:1.7b} && ollama pull ${EMBEDDING_MODEL:-nomic-embed-text}
    restart: "no"
  # R toolchain that extracts a package's help pages to data/extracted/<pkg>.jsonl.
  # Run it with `make extract PKG=stringr` (profile "tools": never started by `up`).
  # Installed R packages are kept in the r_lib volume, so each package is
  # downloaded only once.
  r-extract:
    image: rocker/r-ver:4.5.1
    profiles: ["tools"]
    working_dir: /work
    volumes:
      - ./r:/work/r:ro
      - ./data:/work/data
      - r_lib:/usr/local/lib/R/site-library
    entrypoint: ["Rscript", "/work/r/extract_rd.R"]

volumes:
  qdrant_data:
  ollama_data:
  r_lib:
