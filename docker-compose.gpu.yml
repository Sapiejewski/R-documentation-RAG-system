# NVIDIA GPU for Ollama, layered on top of docker-compose.yml by `make up-gpu`.
#
# Kept in its own file because on a machine without an NVIDIA GPU this
# reservation makes `docker compose up` fail, so plain `make up` must not use it.
#
# Needs the NVIDIA Container Toolkit (Linux) or Docker Desktop with WSL2 (Windows).
# Check, after a model has been used:  docker compose exec ollama ollama ps
# -> PROCESSOR should say "100% GPU".

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
